name: "@keepur/hive-plugin-google"
description: "Gmail + Calendar + Drive access via the gog CLI"
hiveApi: "^1.0.0"
mcp-servers:
  google:
    entry: google-mcp-server.js
    description: "Gmail read/send/reply/labels/filters + Calendar event CRUD + Drive file access"
    usage: "Per-agent Google Workspace access"
    env: [GOG_ACCOUNTS, GOG_ACCOUNT, GOG_CLIENT, DRIVE_SHARED_FOLDER]
agent-seeds: []
